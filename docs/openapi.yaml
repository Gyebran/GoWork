openapi: 3.0.3
info:
  title: GoWork API
  version: 0.1.0
  description: 'V1 design contract. Milestone 1 implements GET /health only; all other
    endpoints are planned. Read docs/contracts.md for ownership, lifecycle and validation
    rules. 1 MiB JSON body limit; reject unknown/repeated query parameters and duplicate
    JSON keys. Global routing errors: 404 NOT_FOUND, 405 METHOD_NOT_ALLOWED. All errors
    follow Error schema and all responses include X-Request-ID.'
servers:
- url: http://localhost:8080
  description: Planned local server, not currently running
security:
- bearerAuth: []
paths:
  /health:
    get:
      operationId: health
      tags:
      - Operations
      security: []
      responses:
        '200':
          description: Process alive
          headers:
            X-Request-ID:
              description: Sanitized incoming correlation ID or generated UUID.
              schema:
                type: string
                minLength: 1
                maxLength: 64
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                required:
                - status
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      x-implemented-milestone: 1
  /ready:
    get:
      operationId: ready
      tags:
      - Operations
      security: []
      responses:
        '200':
          description: Ready for traffic
          headers:
            X-Request-ID:
              description: Sanitized incoming correlation ID or generated UUID.
              schema:
                type: string
                minLength: 1
                maxLength: 64
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum:
                    - ready
                required:
                - status
        '503':
          $ref: '#/components/responses/503'
  /docs:
    get:
      operationId: swaggerUI
      tags:
      - Operations
      security: []
      responses:
        '200':
          description: Available in M11.
          headers:
            X-Request-ID:
              description: Sanitized incoming correlation ID or generated UUID.
              schema:
                type: string
                minLength: 1
                maxLength: 64
          content:
            text/html:
              schema:
                type: string
  /openapi.yaml:
    get:
      operationId: openAPI
      tags:
      - Operations
      security: []
      responses:
        '200':
          description: Available in M11.
          headers:
            X-Request-ID:
              description: Sanitized incoming correlation ID or generated UUID.
              schema:
                type: string
                minLength: 1
                maxLength: 64
          content:
            application/yaml:
              schema:
                type: string
  /api/v1/auth/login:
    post:
      operationId: login
      tags:
      - Auth
      summary: login
      description: Uniform 401 for missing user, wrong password or inactive user.
        No public registration. HS256 access token, 900 seconds.
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              description: Sanitized incoming correlation ID or generated UUID.
              schema:
                type: string
                minLength: 1
                maxLength: 64
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResultResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '409':
          $ref: '#/components/responses/409'
        '413':
          $ref: '#/components/responses/413'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
