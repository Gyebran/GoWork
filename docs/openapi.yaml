openapi: 3.0.3
info:
  title: GoWork API
  version: 1.0.0
  description: 'GoWork Work Order Management API. Login first, copy data.access_token, then use Authorize with the
    token only (without the Bearer prefix). Tokens last 900 seconds; roles and active status are checked from the
    database on every authenticated request. No refresh or logout endpoint. Password change does not revoke existing
    tokens; deactivation does. Try it out executes real operations on the current server.


    ADMIN manages users and all business resources; MANAGER reads users and manages assets/orders; TECHNICIAN reads
    only assigned orders and their assets and progresses assigned orders. Permissions are database-backed, with
    no implicit administrator bypass.


    JSON writes have a 1 MiB limit. Unknown fields, repeated query parameters, null patches and empty patches are
    rejected. Password bounds use UTF-8 bytes, not characters. Lists use page=1 and limit=20 by default, limit at
    most 100; filters combine with AND. Ordering is created_at DESC,id DESC. Every response includes X-Request-ID.
    Errors use the Error schema; 404 NOT_FOUND and 405 METHOD_NOT_ALLOWED apply to routing. A 503 WRITE_OUTCOME_UNKNOWN
    means inspect current state before retrying a write.'
servers:
- url: /
  description: Current server (same origin as this documentation)
security:
- bearerAuth: []
paths:
  /health:
    get:
      operationId: health
      tags:
      - Operations
      security: []
      responses:
        '200':
          description: Process alive
          headers:
            X-Request-ID:
              description: Sanitized incoming correlation ID or generated UUID.
              schema:
                type: string
                minLength: 1
                maxLength: 64
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                required:
                - status
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      x-implemented-milestone: 1
      summary: Check process liveness
      description: Public. Does not query PostgreSQL; remains healthy during a database outage.
  /ready:
    get:
      operationId: ready
      tags:
      - Operations
      security: []
      responses:
        '200':
          description: Ready for traffic
          headers:
            X-Request-ID:
              description: Sanitized incoming correlation ID or generated UUID.
              schema:
                type: string
                minLength: 1
                maxLength: 64
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum:
                    - ready
                required:
                - status
        '503':
          $ref: '#/components/responses/503'
      x-implemented-milestone: 2
      summary: Check database readiness
      description: Public. Verifies database connectivity, expected migration version and shutdown state. Returns
        503 when unavailable.
  /docs:
    get:
      operationId: swaggerUI
      tags:
      - Operations
      security: []
      responses:
        '200':
          description: Swagger UI HTML
          headers:
            X-Request-ID:
              description: Sanitized incoming correlation ID or generated UUID.
              schema:
                type: string
                minLength: 1
                maxLength: 64
          content:
            text/html:
              schema:
                type: string
      summary: Open Swagger UI
      description: Public interactive API documentation. JavaScript/CSS load from version-pinned jsDelivr assets
        with integrity checks. Authorizations are not persisted across reloads.
      x-implemented-milestone: 11
  /openapi.yaml:
    get:
      operationId: openAPI
      tags:
      - Operations
      security: []
      responses:
        '200':
          description: Embedded OpenAPI YAML
          headers:
            X-Request-ID:
              description: Sanitized incoming correlation ID or generated UUID.
              schema:
                type: string
                minLength: 1
                maxLength: 64
          content:
            application/yaml:
              schema:
                type: string
      summary: Download OpenAPI
      description: Public YAML contract embedded into the same API binary. No authentication required.
      x-implemented-milestone: 11
  /api/v1/auth/login:
    post:
      operationId: login
      x-implemented-milestone: 3
      tags:
      - Auth
      summary: Sign in
      description: Uniform 401 INVALID_CREDENTIALS for missing user, wrong password or inactive user. HS256 bearer
        token expires after 900 seconds. No public registration.
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              description: Sanitized incoming correlation ID or generated UUID.
              schema:
                type: string
                minLength: 1
                maxLength: 64
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResultResponse'
              example:
                data:
                  access_token: REPLACE_WITH_TOKEN_FROM_LOGIN
                  token_type: Bearer
                  expires_in: 900
                  user:
                    id: 11111111-1111-4111-8111-111111111111
                    name: Example Technician
                    email: technician@example.com
                    role: TECHNICIAN
                    is_active: true
                    created_at: '2026-09-25T12:00:00Z'
                    updated_at: '2026-09-25T12:00:00Z'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '413':
          $ref: '#/components/responses/413'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
            example:
              email: your-account@example.com
              password: Your-own-password
