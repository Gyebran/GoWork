  /api/v1/users:
    get:
      operationId: listUsers
      x-implemented-milestone: 4
      tags:
      - User
      summary: List users
      description: ADMIN/MANAGER with user:read. Filters role and is_active. Count and rows share one database snapshot.
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              description: Sanitized incoming correlation ID or generated UUID.
              schema:
                type: string
                minLength: 1
                maxLength: 64
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
              example:
                data:
                - id: 11111111-1111-4111-8111-111111111111
                  name: Example Technician
                  email: technician@example.com
                  role: TECHNICIAN
                  is_active: true
                  created_at: '2026-09-25T12:00:00Z'
                  updated_at: '2026-09-25T12:00:00Z'
                meta:
                  page: 1
                  limit: 20
                  total: 1
                  total_pages: 1
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      x-permissions:
      - user:read
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
        description: Exact filter; combines with AND and authorization scope.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Exact filter; combines with AND and authorization scope.
      - name: role
        in: query
        required: false
        schema: &id002
          type: string
          enum:
          - ADMIN
          - MANAGER
          - TECHNICIAN
        description: Exact filter; combines with AND and authorization scope.
      - name: is_active
        in: query
        required: false
        schema:
          type: boolean
        description: Exact filter; combines with AND and authorization scope.
    post:
      operationId: createUser
      x-implemented-milestone: 4
      tags:
      - User
      summary: Create a user
      description: ADMIN with user:create. Creates an active account in the requested role; email is normalized
        and must be unique. Password is 12–72 UTF-8 bytes. Returns Location.
      responses:
