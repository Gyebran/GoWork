      - user:read
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
        description: Exact filter; combines with AND and authorization scope.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Exact filter; combines with AND and authorization scope.
      - name: role
        in: query
        required: false
        schema: &id002
          type: string
          enum:
          - ADMIN
          - MANAGER
          - TECHNICIAN
        description: Exact filter; combines with AND and authorization scope.
      - name: is_active
        in: query
        required: false
        schema:
          type: boolean
        description: Exact filter; combines with AND and authorization scope.
