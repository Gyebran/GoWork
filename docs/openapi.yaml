components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Paste data.access_token from login; Swagger adds Bearer automatically. Token expires after 900
        seconds. Authorization is held in memory only.
  schemas:
    User:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        name: &id010
          type: string
          minLength: 1
          maxLength: 100
        email: &id011
          type: string
          format: email
          minLength: 3
          maxLength: 254
          description: Trimmed lowercase ASCII email, no display-name form.
        role: *id002
        is_active:
          type: boolean
        created_at: &id003
          type: string
          format: date-time
        updated_at: *id003
      required:
      - id
      - name
      - email
      - role
      - is_active
      - created_at
      - updated_at
      example:
        id: 11111111-1111-4111-8111-111111111111
        name: Example Technician
        email: technician@example.com
        role: TECHNICIAN
        is_active: true
        created_at: '2026-09-25T12:00:00Z'
        updated_at: '2026-09-25T12:00:00Z'
    Asset:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        asset_code:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9_-]{0,49}$
        name: &id013
          type: string
          minLength: 1
          maxLength: 150
        category: *id004
        location: &id014
          type: string
          minLength: 1
          maxLength: 200
        status: *id005
        created_at: *id003
        updated_at: *id003
      required:
      - id
      - asset_code
      - name
      - category
      - location
      - status
      - created_at
      - updated_at
      example:
        id: 22222222-2222-4222-8222-222222222222
        asset_code: PUMP-001
        name: Water pump
        category: Utilities
        location: Building A
        status: ACTIVE
        created_at: '2026-09-25T12:00:00Z'
        updated_at: '2026-09-25T12:00:00Z'
