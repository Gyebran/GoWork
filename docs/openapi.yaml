        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /api/v1/users:
    get:
      operationId: listUsers
      tags:
      - User
      summary: listUsers
      description: Fixed created_at DESC,id DESC order; page/count use one snapshot.
