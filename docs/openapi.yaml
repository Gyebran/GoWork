      summary: List visible assets
      description: ADMIN/MANAGER with asset:read see all; TECHNICIAN sees assets referenced by their assigned orders,
        including terminal orders. Search is a literal case-insensitive substring of name, asset_code or location.
        Count and rows share a snapshot.
      responses:
