name: Database foundation
on:
  push:
    branches: [main, milestone-2]
  pull_request:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_USER: gowork_owner
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: gowork_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gowork_owner -d gowork_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgres://gowork_owner:ephemeral_ci_only@localhost:5432/gowork_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check
      - run: make sqlc && git diff --exit-code -- internal/platform/database/sqlc
      - run: make test-integration
